name: Build Gradle project
on: 
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-gradle-project:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run build with Gradle Wrapper
      run: ./gradlew build -x lint

  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [26, 29, 35]
    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.api-level < 35 && '17' || '21' }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        target: ${{ matrix.api-level < 35 && 'default' || 'aosp_atd' }}
        arch: x86_64
        script: ./gradlew connectedAndroidTest --stacktrace
        disable-animations: true
        disable-spellchecker: true

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-api-${{ matrix.api-level }}
        path: |
          mobile/build/reports/androidTests/
          mobile/build/outputs/androidTest-results/

  # Checks that the R8 keep rules preserve the backup format: BackupFormatGoldenTest against the
  # minified release build (see MIGRATION.md). One API level is enough; dependency or AGP updates
  # can change R8 behavior, so this runs on every PR.
  minified-backup-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run golden tests against the minified build
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        script: ./gradlew connectedAndroidTest -PtestMinified -Pandroid.testInstrumentationRunnerArguments.class=org.fedorahosted.freeotp.BackupFormatGoldenTest --stacktrace
        disable-animations: true
        disable-spellchecker: true

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-minified
        path: |
          mobile/build/reports/androidTests/
          mobile/build/outputs/androidTest-results/
